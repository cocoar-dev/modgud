services:
  postgres:
    image: postgres:17-alpine
    container_name: cocoar-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: ghcr.io/cocoar-dev/cocoar.auth:0.1.0-beta.45
    container_name: cocoar-auth
    ports:
      - "4200:80"
    environment:
      # Database (override Host for Docker networking)
      DATABASE_CONNECTIONSTRING: "Host=postgres;Database=cocoar_auth;Username=postgres;Keepalive=30"
      DATABASE_PASSWORD: "postgres"
      # Auth
      AUTH_COOKIESECUREPOLICY: "None"
      # OpenIddict
      OPENIDDICT_ISSUER: "http://localhost:4200"
      OPENIDDICT_DEVELOPMENTMODE: "true"
      # SMTP (mock — emails logged to console)
      SMTP_HOST: "localhost"
      SMTP_PORT: "25"
      SMTP_USESSL: "false"
      SMTP_FROMADDRESS: "noreply@localhost"
      SMTP_FROMNAME: "Cocoar Auth"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
