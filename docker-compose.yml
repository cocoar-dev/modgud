services:
  postgres:
    image: postgres:17-alpine
    container_name: cocoar-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: ghcr.io/cocoar-dev/cocoar.auth:staging
    container_name: cocoar-auth
    # Container listens on 8081 (non-privileged — the .NET aspnet image runs
    # as a non-root user and can't bind <1024 without USER root). The host
    # mapping exposes that as :80 so users can hit http://localhost/ without
    # a reverse proxy. For HTTPS, terminate TLS in your reverse proxy and
    # forward to :80 here.
    ports:
      - "80:8081"
    environment:
      # Cocoar.Configuration v5 binds env vars by `<section>__<property>`
      # (double underscore = section boundary). The `<section>` part is
      # the prefix the rule registers; for top-level StartUpConfiguration
      # rules the section is the property name on that class.
      #
      # Marten connection string. Keepalive=30 keeps idle pooled
      # connections healthy through the docker-network NAT.
      DBSETTINGS__CONNECTIONSTRING: "Host=postgres;Database=cocoar_auth;Username=postgres;Password=postgres;Keepalive=30"
      # AppUrl tells Kestrel what to bind inside the container. Stays at
      # 8081 — the host port mapping above exposes it as :80.
      APPURL: "http://0.0.0.0:8081"
      # OpenIddict issuer = the public URL clients see in
      # /.well-known/openid-configuration. Per-realm overrides apply at
      # request time via RealmIssuerHandler.
      OPENIDDICT__ISSUER: "http://localhost"
      # Ephemeral signing keys; tokens get invalidated on every
      # restart. Switch to false + a signing certificate for prod.
      OPENIDDICT__DEVELOPMENTMODE: "true"
      # SMTP — these defaults route nowhere (host = localhost in the
      # container = the container itself, no MTA). Override to a real
      # SMTP relay before going live, or operators won't get
      # notifications.
      EMAIL__SMTP__HOST: "localhost"
      EMAIL__SMTP__PORT: "25"
      EMAIL__SMTP__USESSL: "false"
      EMAIL__SMTP__FROMADDRESS: "noreply@localhost"
      EMAIL__SMTP__FROMNAME: "Cocoar Auth"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
