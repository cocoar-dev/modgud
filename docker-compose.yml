# Local-development / contributor convenience: brings up Postgres + the
# published staging image with a dev-shaped configuration (http://localhost,
# ephemeral keys). This is NOT the onboarding path — getting started never
# requires cloning the repo. New operators follow the self-contained recipe in
# docs/getting-started/quickstart.md (a copy-paste compose that pulls the
# published image), and production deployments follow docs/operate/deployment.md.
services:
  postgres:
    image: postgres:17-alpine
    container_name: cocoar-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: ghcr.io/cocoar-dev/modgud:staging
    container_name: modgud
    # Container listens on 8081 (non-privileged — the .NET aspnet image runs
    # as a non-root user and can't bind <1024 without USER root). The host
    # mapping exposes that as :80 so users can hit http://localhost/ without
    # a reverse proxy. For HTTPS, terminate TLS in your reverse proxy and
    # forward to :80 here.
    ports:
      - "80:8081"
    environment:
      # Dev-shaped on purpose: the published image defaults to
      # ASPNETCORE_ENVIRONMENT=Production, whose boot guards reject a
      # localhost / http issuer and DevelopmentMode. This convenience stack
      # runs in Development so http://localhost + ephemeral keys are allowed.
      # For a production-shaped run see docs/operate/deployment.md.
      ASPNETCORE_ENVIRONMENT: Development
      # Cocoar.Configuration v6 binds env vars by `<Section>__<Property>`
      # (double underscore = section boundary) and is case-insensitive on the
      # property side — ALL_CAPS and PascalCase both bind. PascalCase here is a
      # readability convention, not a correctness requirement.
      #
      # Marten connection string. Keepalive=30 keeps idle pooled
      # connections healthy through the docker-network NAT.
      DbSettings__ConnectionString: "Host=postgres;Database=modgud;Username=postgres;Password=postgres;Keepalive=30"
      # AppUrl tells Kestrel what to bind inside the container. Stays at
      # 8081 — the host port mapping above exposes it as :80.
      AppUrl: "http://0.0.0.0:8081"
      # OpenIddict issuer = the public URL clients see in
      # /.well-known/openid-configuration. Per-realm overrides apply at
      # request time via RealmIssuerHandler.
      OpenIddict__Issuer: "http://localhost"
      # Ephemeral signing keys; tokens get invalidated on every
      # restart. Switch to false + a signing certificate for prod.
      OpenIddict__DevelopmentMode: "true"
      # SMTP — these defaults route nowhere (host = localhost in the
      # container = the container itself, no MTA). Override to a real
      # SMTP relay before going live, or operators won't get
      # notifications.
      Email__Smtp__Host: "localhost"
      Email__Smtp__Port: "25"
      Email__Smtp__UseSsl: "false"
      Email__Smtp__FromAddress: "noreply@localhost"
      Email__Smtp__FromName: "Modgud"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
