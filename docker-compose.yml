services:
  postgres:
    image: postgres:17-alpine
    container_name: cocoar-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cocoar-auth
    ports:
      - "4200:80"
    environment:
      # Database
      DATABASE_CONNECTIONSTRING: "Host=postgres;Database=cocoar_auth;Username=postgres"
      DATABASE_PASSWORD: "postgres"
      # Auth
      AUTH_COOKIE__SECUREPOLICY: "None"
      # CORS
      CORS_ALLOWEDORIGINS__0: "http://localhost:4200"
      CORS_ALLOWCREDENTIALS: "true"
      # OpenIddict
      OPENIDDICT_ISSUER: "http://localhost:4200"
      OPENIDDICT_DEVELOPMENTMODE: "true"
      OPENIDDICT_ACCESSTOKENLIFETIMEMINUTES: "60"
      OPENIDDICT_REFRESHTOKENLIFETIMEDAYS: "14"
      OPENIDDICT_AUTHORIZATIONCODELIFETIMEMINUTES: "5"
      # SMTP (mock — emails logged to console)
      SMTP_HOST: "localhost"
      SMTP_PORT: "25"
      SMTP_USESSL: "false"
      SMTP_FROMADDRESS: "noreply@localhost"
      SMTP_FROMNAME: "Cocoar Auth"
      # WebAuthn
      WEBAUTHN_RELYINGPARTYID: "localhost"
      WEBAUTHN_RELYINGPARTYNAME: "Cocoar Auth"
      WEBAUTHN_ORIGINS__0: "http://localhost:4200"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
