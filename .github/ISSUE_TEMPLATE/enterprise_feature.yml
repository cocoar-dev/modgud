name: SAML / LDAP / HA / Enterprise feature
description: For requests around SAML, LDAP, day-one HA, or compliance certs.
title: "[Enterprise] "
labels: ["out-of-scope", "wontfix"]
body:
  - type: markdown
    attributes:
      value: |
        ## Sizing reality check

        Modgud is a self-hosted multi-tenant OIDC provider built for
        **owner-operator SaaS teams** — single-instance, opinionated,
        owned by one developer alongside a day job.

        The following are **intentionally out of scope** today:

        - **SAML** — OIDC-only. No plan to add SAML.
        - **LDAP / Active Directory direct binding** — federated login
          via OIDC providers (Entra, Google, Auth0) is supported.
        - **Day-one HA / multi-instance** — the deployment model is
          single-instance with Postgres as the durable state. Real HA
          (Redis-backed DataProtection, SignalR backplane, distributed
          rate limiting) is on the roadmap but not committed.
        - **Compliance certs (SOC 2, ISO 27001, FedRAMP)** — Modgud is
          GDPR-aware and ships with a security-hardening track record,
          but it has no third-party certifications.
        - **24/7 commercial support** — best-effort community-driven,
          response times in days not hours.

        If any of these are hard requirements for you, please use one
        of the mature alternatives:

        - **[Keycloak](https://www.keycloak.org/)** — Red-Hat-backed,
          SAML+OIDC, big-deployment-ready
        - **[Zitadel](https://zitadel.com/)** — managed or self-hosted,
          SOC 2 + ISO 27001
        - **[Authentik](https://goauthentik.io/)** — open-source IdP
          with SAML, LDAP outpost, broad protocol support

        The full reasoning is in the
        [Roadmap → Sizing reality check](https://github.com/cocoar-dev/modgud/blob/develop/docs/roadmap.md#sizing-reality-check).

  - type: dropdown
    id: feature
    attributes:
      label: Which feature?
      options:
        - SAML
        - LDAP / AD direct bind
        - Day-one HA / multi-instance
        - Compliance cert (SOC 2 / ISO 27001 / FedRAMP / other)
        - Commercial support / SLA
        - Other enterprise capability not on the Roadmap
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Your context (optional)
      description: |
        If you want to share why you need this, it helps me understand
        the demand — but I'm unlikely to commit to enterprise features.
        If it's a hard requirement, please consider Keycloak / Zitadel /
        Authentik (linked above).
    validations:
      required: false

  - type: checkboxes
    id: acknowledge
    attributes:
      label: Acknowledgement
      options:
        - label: I read the Sizing reality check and understand this is intentionally out of scope
          required: true
