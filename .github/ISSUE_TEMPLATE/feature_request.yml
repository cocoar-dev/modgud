name: Feature request
description: A capability you'd like Modgud to have.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The [Roadmap](https://github.com/cocoar-dev/modgud/blob/develop/docs/roadmap.md)
        shows what's coming next — your idea might already be tracked
        there. If it's a bigger piece of work, opening a
        [Discussion](https://github.com/cocoar-dev/modgud/discussions)
        first is often the fastest path: "would you accept a PR for X?"
        gets a quicker answer than a surprise PR.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What are you trying to do that Modgud doesn't let you do? Focus
        on the use case, not the proposed solution.
      placeholder: |
        e.g. "I run Modgud in front of three apps and I want to revoke
        a user's session in app A without affecting their session in
        app B."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed UX or API
      description: |
        What would the admin / integrator / end-user experience look
        like? Endpoint shape, admin-UI screen, claim format — whatever
        fits.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Workarounds you tried or rejected. Other tools that solve this
        well, if any.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and discussions
          required: true
