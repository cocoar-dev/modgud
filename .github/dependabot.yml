# Dependabot configuration for cocoar-dev/modgud
#
# Dependency policy (changed 2026-06-15): we do NOT want routine version-update
# PRs for the application code. The npm + nuget version-update blocks were
# removed because they produced a steady stream of one-PR-per-dependency noise.
#
# Outdated / vulnerable application dependencies are now surfaced WITHOUT PRs:
#   - .github/workflows/dependency-report.yml runs monthly and maintains ONE
#     tracking issue (label `dependency-report`) listing every outdated +
#     vulnerable NuGet and pnpm package. Fix those locally.
#   - Dependabot ALERTS (repo Settings -> Code security) keep notifying about
#     CVEs in the Security tab — they are settings-driven, need no entry here,
#     and open no PRs. Leave "Dependabot security updates" DISABLED so it does
#     not auto-open security PRs.
#   - ci.yml already fails any PR that introduces a known CVE
#     (`dotnet list package --vulnerable` / `pnpm audit`).
#
# Only GitHub Actions versions are still managed here: there is no equivalent
# `outdated` CLI for them, the volume is tiny (monthly, rarely changes), and
# keeping CI actions patched is security-relevant. Remove this last block too
# if you want Dependabot to open literally zero PRs.

version: 2
updates:
  # GitHub Actions workflow deps — low-volume, security-relevant, not covered
  # by the dependency-report workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
