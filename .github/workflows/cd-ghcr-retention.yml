name: CD - GHCR Retention

# Prunes old Modgud container images from GHCR so storage stays bounded.
# There is NO automatic GHCR retention policy configured on the package —
# this workflow IS the cleanup.
#
# Keep / age model (everything is age-based; no per-event immediate deletes):
#   KEEP forever — any version whose tags include:
#     - a release semver `X.Y.Z`
#     - a long-lived moving pointer: `latest`, `beta`, `rc`
#   AGE OUT — every other version:
#     - untagged layers            → delete when older than UNTAGGED_DAYS
#     - anything else tagged        → delete when older than AGED_DAYS
#       (immutable prereleases `X.Y.Z-…N` / `X.Y.Z.N`, AND feature-slug moving
#        pointers like `:saml-federation`)
#
# Grace period for feature branches: a `:slug` pointer sits on the branch's
# latest build. While the branch is built it stays fresh; once it's merged /
# abandoned and stops building, that build ages and is pruned after AGED_DAYS.
# So a merged branch's image lingers ~AGED_DAYS, not deleted on the spot.
#
# The scheduled run prunes for real. Manual dispatch defaults to dry_run=true
# (logs only) — pass dry_run=false to prune from a dispatch.

on:
  schedule:
    - cron: '17 4 * * 0'   # weekly, Sunday 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be deleted without deleting'
        type: boolean
        required: false
        default: true

permissions:
  packages: write

env:
  ORG: cocoar-dev
  PACKAGE: modgud
  AGED_DAYS: '30'
  UNTAGGED_DAYS: '7'

jobs:
  prune:
    name: Prune old container versions
    runs-on: ubuntu-latest
    steps:
      - name: Prune
        uses: actions/github-script@v9
        env:
          # schedule has no inputs → defaults to 'false' (live prune). Manual
          # dispatch still defaults to dry_run=true; pass dry_run=false to prune.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        with:
          script: |
            const org = process.env.ORG;
            const pkg = process.env.PACKAGE;
            const dryRun = process.env.DRY_RUN !== 'false';
            const agedMs = Number(process.env.AGED_DAYS) * 86400000;
            const untMs = Number(process.env.UNTAGGED_DAYS) * 86400000;
            const now = Date.now();

            const KEEP_LABELS = new Set(['latest', 'beta', 'rc']);
            const isRelease = t => /^\d+\.\d+\.\d+$/.test(t);   // X.Y.Z (stable)
            const isKeep = t => isRelease(t) || KEEP_LABELS.has(t);

            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
              { package_type: 'container', package_name: pkg, org, per_page: 100 }
            );

            let kept = 0, deleted = 0;
            for (const v of versions) {
              const tags = v.metadata?.container?.tags ?? [];
              const ageDays = (now - new Date(v.created_at).getTime()) / 86400000;
              let reason = null;

              if (tags.some(isKeep)) {
                // keep forever (release semver or a long-lived pointer)
              } else if (tags.length === 0) {
                if (ageDays * 86400000 > untMs) reason = `untagged, ${ageDays|0}d`;
              } else {
                // immutable prereleases + feature-slug pointers → age out
                if (ageDays * 86400000 > agedMs) reason = `${tags.join(',')}, ${ageDays|0}d`;
              }

              if (!reason) { kept++; continue; }
              if (dryRun) {
                core.info(`[dry-run] would delete #${v.id} (${reason})`);
              } else {
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container', package_name: pkg, org, package_version_id: v.id,
                });
                core.info(`deleted #${v.id} (${reason})`);
              }
              deleted++;
            }
            core.notice(`${dryRun ? '[dry-run] ' : ''}kept ${kept}, ${dryRun ? 'would delete' : 'deleted'} ${deleted} (total ${versions.length})`);
