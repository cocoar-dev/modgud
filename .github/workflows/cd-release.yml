name: CD - Release

# Unified release pipeline. Triggered when a GitHub Release is published
# (tag `v<X.Y.Z>` cut from develop). Replaces the previously-separate
# cd-deploy-production.yml (Docker) and cd-publish-nuget-stable.yml
# (NuGet), which could fire independently and leave a partial release
# (NuGet shipped, Docker failed — or vice versa).
#
# Pipeline shape:
#
#   1. validate-version
#         |
#         +---> test-backend (unit + integration, ~4 min)
#         +---> pack-nuget   (build + pack → nupkg artifact)
#         +---> build-docker (build + Trivy vuln gate + push :candidate-<run-id>)
#         +---> build-docs   (VitePress build → docs.zip artifact)
#                       |
#                  release-gate (sync — all above green)
#                       |
#         +---> publish-nuget  (download nupkg → nuget.org + provenance attestation)
#         +---> publish-docker (pull :candidate → retag release tags → push)
#                       |
#         +---> supply-chain (cosign sign + provenance attestation + SBOMs)
#         +---> deploy-docs  (download docs.zip → Shelf)
#
# Supply-chain trust artifacts (#117): every release image is scanned
# by Trivy inside build-docker (fixable CRITICAL/HIGH block the release
# gate), pushed with BuildKit SBOM + provenance attestations, signed
# with cosign (keyless, bound to this workflow's OIDC identity) and
# attested via GitHub build provenance — the NuGet packages too. Per-arch
# SPDX SBOMs are attached to the GitHub release. Verification commands
# are documented in docs/operate/supply-chain.md.
#
# Why a candidate tag for Docker: building once and pushing to a
# transient `:candidate-<run-id>` GHCR tag means the image is provably
# what we tested by the time publish-docker re-tags it. No rebuild,
# no artifact-tar dance. The candidate tag is left behind for forensic
# value — set a GHCR retention rule on `candidate-*` if cleanup matters.
#
# Sibling workflows for staging / prerelease / editorial doc paths:
#   - cd-publish-staging-image.yml    — pushes `:beta` / `:<slug>` moving
#                                       Docker tags (auto on develop push + manual)
#   - cd-publish-nuget-prerelease.yml — prerelease NuGet for client-lib
#                                       (manual workflow_dispatch)
#   - cd-deploy-docs.yml              — editorial doc deploy to Shelf
#                                       between releases (manual)

on:
  release:
    types: [published]
  # Manual trigger for iterating on the release pipeline itself
  # without cutting a real release. Defaults to dry-run, which gates
  # every side-effecting step (NuGet push, Docker push of candidate
  # tag, Docker retag, signing/attestation/SBOM publishing, Shelf
  # upload). The Trivy image scan still runs in dry-run — against an
  # image loaded into the runner's local daemon instead of a pushed
  # digest — so the release-gate logic is testable without pushing.
  # A non-dry-run dispatch still
  # works end-to-end but uses the version_override value — useful
  # for republishing a botched release after fixing pipeline logic,
  # *not* a substitute for cutting a normal release.
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version (X.Y.Z or X.Y.Z-suffix) to use; required for dispatch'
        required: true
        default: '0.0.0-test'
      dry_run:
        description: 'Skip side-effecting steps (recommended for pipeline testing)'
        type: boolean
        default: true

concurrency:
  # On release: scope by release id so concurrent releases don't fight.
  # On workflow_dispatch: scope by run id so manual iterations don't fight either.
  group: cd-release-${{ github.event.release.id || github.run_id }}
  cancel-in-progress: false

env:
  CANDIDATE_TAG: candidate-${{ github.run_id }}

jobs:
  validate-version:
    name: Validate & Extract Version
    # release: only develop-targeted releases are valid
    # workflow_dispatch: always allowed (iteration on any branch)
    if: github.event_name == 'workflow_dispatch' || github.event.release.target_commitish == 'develop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      docs-version: ${{ steps.version.outputs.DOCS_VERSION }}
    steps:
      - name: Extract and validate release version
        id: version
        env:
          # For release event: extract from the published tag.
          # For workflow_dispatch: use the version_override input directly
          # (already in X.Y.Z form, so prefix with 'v' for unified handling).
          RAW_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version_override) }}
        run: |
          TAG="$RAW_TAG"
          echo "Tag/version: $TAG"

          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error ::Tag must start with 'v' followed by version (e.g. v0.2.0)"
            exit 1
          fi
          VERSION="${TAG#v}"
          # Accept X.Y.Z and X.Y.Z-suffix (e.g. 0.0.0-test for dispatch dry-runs)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]]; then
            echo "::error ::Invalid version format. Expected X.Y.Z[-suffix], got: $VERSION"
            exit 1
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2 | cut -d- -f1)
          DOCS="v${MAJOR}.${MINOR}"

          echo "Using version: $VERSION (docs slot: $DOCS)"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DOCS_VERSION=$DOCS" >> $GITHUB_OUTPUT

  # ─── Phase 1: build + test (parallel) ───────────────────────────────

  test-backend:
    name: Backend Tests (unit + integration)
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore, build & test (full suite)
        run: |
          dotnet restore Modgud.slnx
          dotnet build Modgud.slnx -c Release --no-restore -p:Version=${{ needs.validate-version.outputs.version }}
          dotnet test Modgud.slnx -c Release --no-build --verbosity normal
        working-directory: ./src/dotnet

  pack-nuget:
    name: Pack NuGet (Client.AspNetCore)
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore Modgud.Client.AspNetCore/Modgud.Client.AspNetCore.csproj
        working-directory: ./src/dotnet

      - name: Build (stable)
        run: |
          dotnet build Modgud.Client.AspNetCore/Modgud.Client.AspNetCore.csproj \
            -c Release --no-restore \
            -p:Version=${{ needs.validate-version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true
        working-directory: ./src/dotnet

      - name: Pack (incl. symbols)
        run: |
          dotnet pack Modgud.Client.AspNetCore/Modgud.Client.AspNetCore.csproj \
            -c Release --no-build \
            -p:Version=${{ needs.validate-version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -o "$GITHUB_WORKSPACE/artifacts"
        working-directory: ./src/dotnet

      - name: Ensure packages exist
        run: |
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg)
          (( ${#files[@]} )) || { echo "::error ::No packages found in artifacts/"; exit 1; }

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ needs.validate-version.outputs.version }}
          path: ${{ github.workspace }}/artifacts
          retention-days: 7

  # Multi-arch (amd64 + arm64) via native runners — each arch builds on its
  # own native runner and pushes by digest; assemble-candidate stitches them
  # into the :candidate manifest list. publish-docker later promotes that whole
  # manifest to the release tags (preserving both arches).
  build-docker:
    name: Build Docker (${{ matrix.arch }})
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Real release / non-dry dispatch: push each arch by digest, with
      # BuildKit SBOM + max provenance attestations baked into the pushed
      # manifest (imagetools preserves them when assembling :candidate
      # and again when promoting to the release tags).
      # Dry-run dispatch: no push — load the image into the local daemon
      # instead so the Trivy gate below exercises the same image bits.
      # Attestations are off on that path (the docker exporter can't
      # carry them).
      - name: Build (and push by digest unless dry-run)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: ${{ (github.event_name == 'release' || !inputs.dry_run) && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=docker,name=modgud:trivy-scan' }}
          sbom: ${{ github.event_name == 'release' || !inputs.dry_run }}
          provenance: ${{ (github.event_name == 'release' || !inputs.dry_run) && 'mode=max' || 'false' }}

      # Release gate (#117): fixable CRITICAL/HIGH vulnerabilities in the
      # image fail this job → release-gate fails → nothing publishes.
      # Unfixable findings are reported but don't block (there is nothing
      # to ship for them); deliberate exceptions go into .trivyignore
      # with a justification comment. Runs per arch on the native runner,
      # so both platforms' package sets are actually scanned.
      - name: Scan image (Trivy — blocks release on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        # Pin the platform to this arch. On a real release the build pushes
        # by digest with SBOM + provenance (mode=max), so buildx wraps the
        # single-arch image in an index (image manifest + attestation
        # manifests). Given an index, Trivy resolves to its default platform
        # linux/amd64 REGARDLESS of the runner arch — so the arm64 job asked
        # for a linux/amd64 child that an arm64-only index doesn't have and
        # failed ("no child with platform linux/amd64 in index"). amd64 passed
        # only by coincidence. TRIVY_PLATFORM makes each job scan its own arch.
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ (github.event_name == 'release' || !inputs.dry_run) && format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.build.outputs.digest) || 'modgud:trivy-scan' }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore

      - name: Export digest
        if: github.event_name == 'release' || !inputs.dry_run
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'release' || !inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  assemble-candidate:
    name: Assemble :candidate manifest (multi-arch)
    if: github.event_name == 'release' || !inputs.dry_run
    needs: [validate-version, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create :candidate manifest list
        working-directory: /tmp/digests
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create -t "${BASE}:${{ env.CANDIDATE_TAG }}" \
            $(printf "${BASE}@sha256:%s " *)
          docker buildx imagetools inspect "${BASE}:${{ env.CANDIDATE_TAG }}"

  build-docs:
    name: Build Docs (VitePress)
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node + pnpm + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: docs

      - name: Build VitePress
        working-directory: docs
        env:
          DOCS_VERSION: ${{ needs.validate-version.outputs.docs-version }}
        run: pnpm build

      - name: Package
        run: cd docs/.vitepress/dist && zip -r $GITHUB_WORKSPACE/docs.zip .

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ needs.validate-version.outputs.docs-version }}
          path: ${{ github.workspace }}/docs.zip
          retention-days: 7

  # ─── Phase 2: release gate (sync point) ─────────────────────────────

  release-gate:
    name: Release gate (all builds green)
    needs: [validate-version, test-backend, pack-nuget, build-docker, build-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all builds + tests succeeded
        run: |
          echo "✓ All builds + tests green for ${{ needs.validate-version.outputs.version }}"
          echo "Proceeding to publish."

  # ─── Phase 3: publish NuGet + Docker (parallel, gated) ──────────────

  publish-nuget:
    name: Publish NuGet
    # Real releases always publish. Manual dispatch publishes only if
    # explicitly opted out of dry-run.
    if: github.event_name == 'release' || !inputs.dry_run
    needs: [validate-version, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # sigstore keyless identity for the attestation
      attestations: write  # GitHub attestation store

    steps:
      # Checkout is required so the local composite action below
      # (`./.github/actions/setup-dotnet`) is on disk. Must happen
      # before the artifact download — the default `clean: true`
      # behavior of actions/checkout could otherwise wipe the
      # artifacts/ directory we'd just populated.
      - name: Checkout (for local composite action)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Download nupkg artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-${{ needs.validate-version.outputs.version }}
          path: ${{ github.workspace }}/artifacts

      - name: Setup .NET (for `dotnet nuget push`)
        uses: ./.github/actions/setup-dotnet

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg; do
            dotnet nuget push "$p" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      # Provenance attestation for the published packages — verifiable
      # with `gh attestation verify <file>.nupkg -R cocoar-dev/modgud`.
      # Runs after the push so an attestation-infrastructure hiccup
      # can't block the publish itself.
      - name: Attest build provenance (nupkg)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ github.workspace }}/artifacts/*.nupkg
            ${{ github.workspace }}/artifacts/*.snupkg

      - name: Summary
        run: |
          {
            echo "### NuGet — Modgud.Client.AspNetCore ${{ needs.validate-version.outputs.version }}"
            echo ""
            echo "**URL:** https://www.nuget.org/packages/Modgud.Client.AspNetCore/${{ needs.validate-version.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-docker:
    name: Publish Docker (promote candidate → release tags)
    # Real releases always publish. Manual dispatch publishes only if
    # explicitly opted out of dry-run.
    if: github.event_name == 'release' || !inputs.dry_run
    needs: [validate-version, release-gate, assemble-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=production
            type=semver,pattern={{version}},value=${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.validate-version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote candidate to release tags (multi-arch)
        env:
          CAND: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # imagetools create copies the candidate's full manifest list
          # (amd64 + arm64) onto every release tag in one shot — docker
          # tag/push would flatten it to the runner's single arch.
          TAGARGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGARGS="$TAGARGS -t $tag"
          done <<< "$TAGS"
          echo "Promoting $CAND → $TAGS"
          docker buildx imagetools create $TAGARGS "$CAND"

      - name: Summary
        run: |
          {
            echo "### Docker — ${{ needs.validate-version.outputs.version }}"
            echo ""
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate-version.outputs.version }}\`"
            echo "**Public tags:** latest, production, v${{ needs.validate-version.outputs.version }}, v<major>.<minor>, v<major>"
            echo "**Build candidate (forensic):** \`${{ env.CANDIDATE_TAG }}\` — set a GHCR retention rule on \`candidate-*\` to auto-clean."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Phase 4: supply-chain trust artifacts + docs (last) ───────────

  supply-chain:
    name: Supply chain (sign + attest + SBOM)
    # Same publish gate as the other side-effecting jobs.
    if: github.event_name == 'release' || !inputs.dry_run
    needs: [validate-version, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach SBOMs to the GitHub release
      packages: write      # push signature + attestation manifests to GHCR
      id-token: write      # sigstore keyless signing (Fulcio OIDC)
      attestations: write  # GitHub attestation store
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Every release tag points at the same multi-arch manifest list,
      # so one signature/attestation on that digest covers all of them
      # (and the :candidate tag, which promotion copies verbatim).
      - name: Resolve released image digest
        id: digest
        run: |
          IMG="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          DIGEST=$(docker buildx imagetools inspect "$IMG" --format '{{.Manifest.Digest}}')
          echo "Released digest: $DIGEST"
          echo "DIGEST=$DIGEST" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (Fulcio/Rekor): the signature is bound to this workflow
      # run's OIDC identity — no long-lived signing key to manage or
      # leak. --recursive also signs each per-arch child manifest so
      # digest-pinned single-platform pulls verify too.
      - name: Sign image (cosign keyless)
        run: cosign sign --yes --recursive "${REGISTRY}/${IMAGE_NAME}@${{ steps.digest.outputs.DIGEST }}"

      # GitHub build-provenance attestation for the image — verifiable
      # with `gh attestation verify oci://<image>:<tag> -R cocoar-dev/modgud`.
      - name: Attest build provenance (image)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.DIGEST }}
          push-to-registry: true

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOMs (SPDX JSON, per arch)
        run: |
          mkdir -p sboms
          for ARCH in amd64 arm64; do
            "${{ steps.syft.outputs.cmd }}" \
              "registry:${REGISTRY}/${IMAGE_NAME}@${{ steps.digest.outputs.DIGEST }}" \
              --platform "linux/${ARCH}" \
              -o "spdx-json=sboms/modgud-${VERSION}-linux-${ARCH}.spdx.json"
          done
          ls -l sboms/

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sboms-${{ needs.validate-version.outputs.version }}
          path: sboms/*
          retention-days: 90

      # Only the release event has a GitHub release to attach to; a
      # non-dry-run dispatch (botched-release republish) still gets the
      # SBOMs as the workflow artifact above.
      - name: Attach SBOMs to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sboms/* --clobber -R "${{ github.repository }}"

      - name: Summary
        run: |
          {
            echo "### Supply chain — ${VERSION}"
            echo ""
            echo "**Image digest:** \`${{ steps.digest.outputs.DIGEST }}\` — cosign-signed, provenance-attested, per-arch SPDX SBOMs generated."
            echo ""
            echo "Verify:"
            echo '```bash'
            echo "cosign verify ${REGISTRY}/${IMAGE_NAME}:${VERSION} \\"
            echo "  --certificate-identity-regexp '^https://github\\.com/${IMAGE_NAME}/\\.github/workflows/cd-release\\.yml@refs/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${REGISTRY}/${IMAGE_NAME}:${VERSION} -R ${IMAGE_NAME}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-docs:
    name: Deploy Docs
    # Real releases always deploy docs. Manual dispatch deploys only if
    # explicitly opted out of dry-run.
    if: github.event_name == 'release' || !inputs.dry_run
    needs: [validate-version, publish-nuget, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-${{ needs.validate-version.outputs.docs-version }}
          path: ${{ github.workspace }}

      - name: Upload to Shelf
        env:
          KEY: ${{ secrets.SHELF_API_KEY }}
          URL: ${{ secrets.SHELF_BASE_URL }}
          VER: ${{ needs.validate-version.outputs.docs-version }}
        run: |
          echo "Deploying modgud docs $VER to $URL"
          curl -f -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/zip" \
            --data-binary @$GITHUB_WORKSPACE/docs.zip \
            "${URL}/_api/products/modgud/versions/${VER}"

      - name: Summary
        run: |
          {
