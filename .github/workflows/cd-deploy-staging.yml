name: CD - Docker Image (Staging)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason'
        required: false
        default: 'Manual staging deployment'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v4

      - name: Build version string
        id: build_version
        run: |
          BASE="${{ steps.gv.outputs.MajorMinorPatch }}-${{ steps.gv.outputs.PreReleaseLabel }}"
          N="${{ steps.gv.outputs.CommitsSinceVersionSource }}"
          VERSION="$BASE.$N"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION"

  build:
    name: Build & Test
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build Vue Frontend
        working-directory: ./src/frontend-vue
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src/dotnet

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ needs.version.outputs.version }}
        working-directory: ./src/dotnet

      - name: Test (All Categories)
        working-directory: ./src/dotnet
        run: |
          for cat in Smoke Auth TwoFactor OAuth Admin ExternalLogin MultiTenancy GDPR; do
            echo "=== $cat ===" && dotnet test -c Release --no-build --verbosity minimal --filter "Category=$cat"
          done

      - name: Publish
        run: dotnet publish Cocoar.Auth.Api/Cocoar.Auth.Api.csproj -c Release --no-build -o ../publish
        working-directory: ./src/dotnet

      - name: Copy frontend to publish wwwroot
        run: cp -r src/frontend-vue/apps/frontend/dist/* publish/wwwroot/ 2>/dev/null || mkdir -p publish/wwwroot && cp -r src/frontend-vue/apps/frontend/dist/* publish/wwwroot/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: auth-app
          path: ./publish

  deploy:
    name: Deploy to Staging
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: auth-app
          path: ./docker/app

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=raw,value=develop
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deployment summary
        run: |
          echo "### Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging\`" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ github.event.inputs.reason || 'Manual deployment' }}" >> $GITHUB_STEP_SUMMARY
