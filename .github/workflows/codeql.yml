name: CodeQL

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    # Weekly Sunday 03:14 UTC — picks up newly-published advisories that
    # match unchanged code.
    - cron: '14 3 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended pulls in the broader security query suite
          # (covers more taint sinks than the default). security-and-quality
          # is even broader but adds non-security findings — we have
          # NetAnalyzers + SecurityCodeScan for that.
          queries: security-extended

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build C# (manual mode for CodeQL)
        if: matrix.language == 'csharp'
        run: dotnet build Modgud.slnx -c Release
        working-directory: ./src/dotnet

      # `upload: never` runs the analysis and writes SARIF to `output/`
      # without trying to push to GitHub Code Scanning — that endpoint
      # requires either a public repo or GitHub Advanced Security on
      # this private repo, neither of which we have. The SARIF then
      # gets uploaded as a workflow artifact so we can pull it locally
      # and view in VS Code (CodeQL or SARIF Viewer extension).
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: codeql-results

      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results
          retention-days: 30
