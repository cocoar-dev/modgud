name: Dependency report (no PRs)

# Collects outdated + vulnerable dependencies (NuGet + pnpm) on a schedule and
# writes them into exactly ONE tracking issue labelled `dependencies` +
# `dependency-report`. It NEVER opens a pull request.
#
# Why this exists: routine Dependabot *version-update* PRs were too noisy, so
# npm + nuget version-updates were removed from .github/dependabot.yml. This
# workflow replaces them with a single "fix-locally" report. Security CVEs are
# still caught two other ways that open no PRs either:
#   - Dependabot ALERTS in the repo Security tab (real-time, settings-driven),
#   - the existing per-PR audit in ci.yml (`dotnet list package --vulnerable`
#     / `pnpm audit`), which fails the build on a known CVE.
# This monthly scan adds the missing pieces: awareness of merely-outdated deps,
# and a CVE re-check on a cadence even when no code changes land.
#
# NOTE: our .NET side uses Central Package Management (Directory.Packages.props)
# and the .slnx solution format, where GitHub's own dependency graph / Dependabot
# alerts have historically been unreliable for NuGet. The `dotnet package list
# --vulnerable` scan below does NOT depend on the dependency graph, so it is the
# more trustworthy NuGet CVE source for this repo.

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write           # required to create / update the tracking issue

concurrency:
  group: dependency-report
  cancel-in-progress: false

jobs:
  report:
    name: Collect & report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- toolchains (reuse the repo's single-source-of-truth actions) ---
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Setup Node + pnpm + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: ./src/frontend-vue

      # --- collect NuGet (restore first: CPM + .slnx resolve via assets file) ---
      - name: Restore .NET (Central Package Management)
        working-directory: ./src/dotnet
        run: dotnet restore Modgud.slnx

      - name: NuGet outdated (json)
        working-directory: ./src/dotnet
        continue-on-error: true   # the command exits non-zero when updates exist
        run: |
          dotnet package list --project Modgud.slnx \
            --outdated --format json --output-version 1 \
            > "$GITHUB_WORKSPACE/nuget-outdated.json" || true

      - name: NuGet vulnerable (json)
        working-directory: ./src/dotnet
        continue-on-error: true
        run: |
          dotnet package list --project Modgud.slnx \
            --vulnerable --include-transitive --format json --output-version 1 \
            > "$GITHUB_WORKSPACE/nuget-vulnerable.json" || true

      # --- collect pnpm (exits 1 when anything is outdated -> swallow) ---
      - name: pnpm outdated (json)
        working-directory: ./src/frontend-vue
        continue-on-error: true
        run: |
          pnpm outdated --format json \
            > "$GITHUB_WORKSPACE/pnpm-outdated.json" || true

      # --- build one markdown body ---
      - name: Format report
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/report.md"
          {
            echo "_Generated by \`.github/workflows/dependency-report.yml\` on $(date -u '+%Y-%m-%d %H:%M UTC') for commit ${GITHUB_SHA:0:7}._"
            echo
            echo "> This issue is updated **in place** every run — it exists *instead of* Dependabot version PRs."
            echo "> Bump the versions locally, then commit. Known CVEs are also tracked under **Security → Dependabot alerts** and gated in CI."
            echo

            echo "## NuGet — vulnerable"
            if [ -s "$GITHUB_WORKSPACE/nuget-vulnerable.json" ] && jq -e '[.projects[]?.frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[] | select(.vulnerabilities)] | length > 0' "$GITHUB_WORKSPACE/nuget-vulnerable.json" >/dev/null 2>&1; then
              echo
              echo "| Package | Resolved | Severity | Advisory |"
              echo "|---|---|---|---|"
              jq -r '.projects[]?.frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[] | select(.vulnerabilities) | .id as $id | .resolvedVersion as $v | .vulnerabilities[] | "| \($id) | \($v) | \(.severity) | \(.advisoryurl) |"' "$GITHUB_WORKSPACE/nuget-vulnerable.json" | sort -u
            else
              echo
              echo "No known NuGet vulnerabilities. :white_check_mark:"
            fi
            echo

            echo "## NuGet — outdated (top-level)"
            if [ -s "$GITHUB_WORKSPACE/nuget-outdated.json" ] && jq -e '[.projects[]?.frameworks[]?.topLevelPackages[]?] | length > 0' "$GITHUB_WORKSPACE/nuget-outdated.json" >/dev/null 2>&1; then
              echo
              echo "| Package | Resolved | Latest |"
              echo "|---|---|---|"
              jq -r '.projects[]?.frameworks[]?.topLevelPackages[]? | "| \(.id) | \(.resolvedVersion) | \(.latestVersion) |"' "$GITHUB_WORKSPACE/nuget-outdated.json" | sort -u
            else
              echo
              echo "All NuGet top-level packages up to date. :white_check_mark:"
            fi
            echo

            echo "## pnpm — outdated (src/frontend-vue)"
            if [ -s "$GITHUB_WORKSPACE/pnpm-outdated.json" ] && jq -e 'type == "object" and (length > 0)' "$GITHUB_WORKSPACE/pnpm-outdated.json" >/dev/null 2>&1; then
              echo
              echo "| Package | Current | Wanted | Latest | Type |"
              echo "|---|---|---|---|---|"
              jq -r 'to_entries[] | "| \(.key) | \(.value.current // "-") | \(.value.wanted // "-") | \(.value.latest // "-") | \(.value.dependencyType // "-") |"' "$GITHUB_WORKSPACE/pnpm-outdated.json" | sort -u
            else
              echo
              echo "All pnpm dependencies up to date. :white_check_mark:"
            fi
          } > "$OUT"
          echo "Wrote $OUT"

      # --- find the single existing tracking issue (idempotent upsert) ---
      - name: Find existing issue
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list \
                  --state open \
                  --label dependencies \
                  --label dependency-report \
                  --json number --jq '.[0].number // empty' \
                  --limit 1)
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          echo "Existing tracking issue: ${NUM:-<none, will create>}"

      - name: Create or update the tracking issue
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 'Dependency report — outdated & vulnerable packages'
          content-filepath: ./report.md
          issue-number: ${{ steps.find.outputs.number }}
          labels: |
            dependencies
            dependency-report
