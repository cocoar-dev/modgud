name: CD - Publish NuGet Prerelease

# Builds and publishes a prerelease of Modgud.Client.AspNetCore to
# nuget.org. Mirrors the cocoar.configuration workflow pattern so the
# release plumbing is consistent across the org.
#
# Why workflow_dispatch only (not auto-triggered on develop push)
# ────────────────────────────────────────────────────────────────
# Asymmetric with `cd-publish-staging-image.yml`, which DOES auto-
# publish a Docker image on every develop merge. The reason:
#
#   - Docker `:beta` is a moving pointer tag. Each push
#     overwrites the previous one; the previous image becomes
#     untagged and the GHCR retention rule deletes it. Cheap to
#     update on every commit.
#   - NuGet versions are permanent. `0.1.0-beta.7` cannot be
#     overwritten — only superseded by `0.1.0-beta.8`. Auto-
#     publishing on every develop merge would pollute the
#     nuget.org listing with hundreds of prerelease versions in a
#     few months and bury the stable releases. Industry pattern
#     for the same reason: NuGet prereleases are manual on-demand.
#
# Trigger this when:
#   - You need a specific prerelease build to test in a downstream
#     consumer app
#   - An external user asked for "the latest" of the client library
#   - Pre-stable release-candidate testing
#
# Otherwise leave it alone. The version still ships via the
# `cd-release.yml` stable-publish path on Release-tag-published.
#
# What the workflow does
# ──────────────────────
#   - GitVersion computes the version as
#       <MajorMinorPatch>-<PreReleaseLabel>.<CommitsSinceVersionSource>
#     (so a build on `develop` becomes e.g. `0.1.0-beta.7`)
#   - Ubuntu-only test/pack — the lib is pure managed code with no
#     platform-specific behavior; multi-OS coverage would just slow
#     the gate down without catching anything new.
#
# Required org-wide secret: NUGET_API_KEY (nuget.org "Push" scope,
# glob `Modgud.*`).

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test client lib
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore client lib + unit tests
        run: |
          dotnet restore Modgud.Client.AspNetCore/Modgud.Client.AspNetCore.csproj
          dotnet restore Modgud.Tests.Unit/Modgud.Tests.Unit.csproj
        working-directory: ./src/dotnet

      - name: Build client lib + unit tests
        run: |
          dotnet build Modgud.Client.AspNetCore/Modgud.Client.AspNetCore.csproj -c Release --no-restore
          dotnet build Modgud.Tests.Unit/Modgud.Tests.Unit.csproj -c Release --no-restore
        working-directory: ./src/dotnet

      # Filter to the Client.AspNetCore tests so we don't pull in
      # integration tests that need Docker/Postgres (those live in
      # Modgud.Api.Tests and aren't relevant for a client-lib
      # publish gate).
      - name: Test client lib
        run: dotnet test Modgud.Tests.Unit/Modgud.Tests.Unit.csproj -c Release --no-build --verbosity normal --filter "FullyQualifiedName~Client"
        working-directory: ./src/dotnet

  publish-prerelease:
    name: Pack & Push Prerelease
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET + GitVersion
        id: dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          with-gitversion: 'true'

      - name: Build prerelease version
        id: prerelease
        run: |
          MMP="${{ steps.dotnet.outputs.major-minor-patch }}"
          LABEL="${{ steps.dotnet.outputs.pre-release-label }}"
          N="${{ steps.dotnet.outputs.commits-since-version-source }}"
          # Defensive: GitVersion can return an empty pre-release-label when
          # the branch matches no named config. Fall back to the escaped
          # branch name so we never emit a malformed `X.Y.Z-.N` NuGet
          # version.
          if [ -z "$LABEL" ]; then
            LABEL="${{ steps.dotnet.outputs.escaped-branch-name }}"
          fi
          if [ -z "$LABEL" ]; then
            VERSION="$MMP.$N"
          else
            VERSION="$MMP-$LABEL.$N"
          fi
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated prerelease version: $VERSION"

      - name: Restore
        run: dotnet restore Modgud.Client.AspNetCore/Modgud.Client.AspNetCore.csproj
        working-directory: ./src/dotnet

      - name: Build
        run: |
          dotnet build Modgud.Client.AspNetCore/Modgud.Client.AspNetCore.csproj \
            -c Release --no-restore \
            -p:Version=$PACKAGE_VERSION \
            -p:AssemblyVersion=${{ steps.dotnet.outputs.assembly-semver }} \
            -p:FileVersion=${{ steps.dotnet.outputs.assembly-sem-file-ver }} \
            -p:ContinuousIntegrationBuild=true
        working-directory: ./src/dotnet

      - name: Pack (incl. symbols)
        run: |
          dotnet pack Modgud.Client.AspNetCore/Modgud.Client.AspNetCore.csproj \
            -c Release --no-build \
            -p:Version=$PACKAGE_VERSION \
            -p:ContinuousIntegrationBuild=true \
            -o "$GITHUB_WORKSPACE/artifacts"
        working-directory: ./src/dotnet

      - name: Ensure packages exist
        run: |
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg)
          (( ${#files[@]} )) || { echo "::error ::No packages found in artifacts/"; exit 1; }

      - name: Upload artifacts (audit)
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-packages-${{ env.PACKAGE_VERSION }}
          path: ${{ github.workspace }}/artifacts
          retention-days: 30

      # Feed-gate: only develop betas land on the permanent public feed.
      # Feature-branch dispatches produce the .nupkg artifact above for
      # local/internal testing but are NOT pushed — nuget.org versions are
      # permanent (only unlistable) and there is no anonymous-pullable
      # alternative feed, so we keep the public feed to develop betas +
      # stable releases only.
      - name: Push prerelease to NuGet.org
        if: github.ref == 'refs/heads/develop'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg; do
            echo "Pushing prerelease package: $p"
            dotnet nuget push "$p" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Summary
        run: |
          {
            echo "### Modgud.Client.AspNetCore — $PACKAGE_VERSION (prerelease)"
            echo ""
            if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
              echo "**Pushed to:** https://www.nuget.org/packages/Modgud.Client.AspNetCore/$PACKAGE_VERSION"
            else
              echo "**Artifact only** (feature branch — not pushed to nuget.org)."
              echo "Download the \`prerelease-packages-$PACKAGE_VERSION\` artifact and add it as a local source to test."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
