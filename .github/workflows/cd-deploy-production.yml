name: CD - Deploy Production

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: true

jobs:
  validate-version:
    name: Validate & Extract Version
    if: github.event.release.target_commitish == 'develop'
    runs-on: [self-hosted, hetzner]
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Extract and validate release version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG"

          if [[ "$TAG" =~ ^v[0-9] ]]; then
            VERSION="${TAG#v}"
          else
            echo "::error ::Tag must start with 'v' followed by version number (e.g., v1.0.0)"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error ::Invalid release version format. Expected X.Y.Z or X.Y.Z-label (e.g., 1.2.3, 1.2.3-beta.1), got: $VERSION"
            exit 1
          fi

          echo "Using release version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build & Test
    needs: validate-version
    runs-on: [self-hosted, hetzner]
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build Vue Frontend
        working-directory: ./src/frontend-vue
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src/dotnet

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ needs.validate-version.outputs.version }}
        working-directory: ./src/dotnet

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal
        working-directory: ./src/dotnet

      - name: Publish
        run: dotnet publish Cocoar.Auth.Api/Cocoar.Auth.Api.csproj -c Release --no-build -o ../publish
        working-directory: ./src/dotnet

      - name: Copy frontend to publish wwwroot
        run: cp -r src/frontend-vue/apps/frontend/dist/* publish/wwwroot/ 2>/dev/null || mkdir -p publish/wwwroot && cp -r src/frontend-vue/apps/frontend/dist/* publish/wwwroot/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: auth-app
          path: ./publish

  deploy:
    name: Deploy to Production
    needs: [validate-version, build]
    runs-on: [self-hosted, hetzner]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: auth-app
          path: ./docker/app

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=production
            type=semver,pattern={{version}},value=${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.validate-version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deployment summary
        run: |
          echo "### Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY

  deploy-docs:
    name: Deploy Documentation
    needs: [validate-version, deploy]
    runs-on: [self-hosted, hetzner]
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build VitePress
        working-directory: website
        run: npx vitepress build

      - name: Package
        run: cd website/.vitepress/dist && zip -r $GITHUB_WORKSPACE/docs.zip .

      - name: Extract docs version
        id: docs-version
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            # Pre-release: use full version (e.g. v1.0.0-beta.1)
            echo "value=v${VERSION}" >> $GITHUB_OUTPUT
          else
            # Stable: use major.minor (e.g. v1.0)
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            echo "value=v${MAJOR}.${MINOR}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Shelf
        env:
          KEY: ${{ secrets.SHELF_API_KEY }}
          URL: ${{ secrets.SHELF_BASE_URL }}
          VER: ${{ steps.docs-version.outputs.value }}
        run: |
          echo "Deploying docs $VER to $URL"
          curl -f -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/zip" \
            --data-binary @$GITHUB_WORKSPACE/docs.zip \
            "${URL}/_api/products/cocoar-auth/versions/${VER}"

      - name: Docs deployment summary
        run: |
          echo "### Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Product:** cocoar-auth" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.docs-version.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ secrets.SHELF_BASE_URL }}/cocoar-auth/" >> $GITHUB_STEP_SUMMARY
