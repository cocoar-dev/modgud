name: NuGet Stable (Client.AspNetCore)

# Publishes a stable release of Cocoar.Auth.Client.AspNetCore to
# nuget.org. Mirrors cocoar.configuration: triggered by a GitHub Release
# tagged `v<X.Y.Z>` (strict semver, no prerelease suffix). Releases must
# be cut from `develop`.
#
# Required org-wide secret: NUGET_API_KEY (nuget.org "Push" scope,
# glob `Cocoar.Auth.*`).
#
# Why a GitHub Release (not just a tag push)? Releases carry release
# notes + an explicit "published" event that's easier to track in the
# UI; the tag-form check still guards the version string.

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate & Extract Version
    if: github.event.release.target_commitish == 'develop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Extract and validate release version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG"

          if [[ "$TAG" =~ ^v[0-9] ]]; then
            VERSION="${TAG#v}"
          else
            echo "::error ::Tag must start with 'v' followed by version number (e.g. v0.1.0)"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid release version format. Expected X.Y.Z, got: $VERSION"
            exit 1
          fi

          echo "Using release version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  test:
    name: Test client lib
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore client lib + unit tests
        run: |
          dotnet restore Cocoar.Auth.Client.AspNetCore/Cocoar.Auth.Client.AspNetCore.csproj
          dotnet restore Cocoar.Auth.Tests.Unit/Cocoar.Auth.Tests.Unit.csproj
        working-directory: ./src/dotnet

      - name: Build client lib + unit tests
        run: |
          dotnet build Cocoar.Auth.Client.AspNetCore/Cocoar.Auth.Client.AspNetCore.csproj -c Release --no-restore
          dotnet build Cocoar.Auth.Tests.Unit/Cocoar.Auth.Tests.Unit.csproj -c Release --no-restore
        working-directory: ./src/dotnet

      # Filter — same rationale as the prerelease workflow: we only
      # gate on the Client tests; integration tests need Docker and
      # ship via a different pipeline.
      - name: Test client lib
        run: dotnet test Cocoar.Auth.Tests.Unit/Cocoar.Auth.Tests.Unit.csproj -c Release --no-build --verbosity normal --filter "FullyQualifiedName~Client"
        working-directory: ./src/dotnet

  publish:
    name: Pack & Publish Stable
    needs: [validate-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cocoar.Auth.Client.AspNetCore/Cocoar.Auth.Client.AspNetCore.csproj
        working-directory: ./src/dotnet

      - name: Build (stable)
        run: |
          dotnet build Cocoar.Auth.Client.AspNetCore/Cocoar.Auth.Client.AspNetCore.csproj \
            -c Release --no-restore \
            -p:Version=${{ needs.validate-version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true
        working-directory: ./src/dotnet

      - name: Pack (incl. symbols)
        run: |
          dotnet pack Cocoar.Auth.Client.AspNetCore/Cocoar.Auth.Client.AspNetCore.csproj \
            -c Release --no-build \
            -p:Version=${{ needs.validate-version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -o "$GITHUB_WORKSPACE/artifacts"
        working-directory: ./src/dotnet

      - name: Ensure packages exist
        run: |
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg)
          (( ${#files[@]} )) || { echo "::error ::No packages found in artifacts/"; exit 1; }

      - name: Upload artifacts (audit)
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ needs.validate-version.outputs.version }}
          path: ${{ github.workspace }}/artifacts
          retention-days: 7

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg; do
            dotnet nuget push "$p" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Summary
        run: |
          {
            echo "### Cocoar.Auth.Client.AspNetCore — ${{ needs.validate-version.outputs.version }} (stable)"
            echo ""
            echo "**Released from:** ${{ github.event.release.tag_name }} on develop"
            echo "**URL:** https://www.nuget.org/packages/Cocoar.Auth.Client.AspNetCore/${{ needs.validate-version.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
