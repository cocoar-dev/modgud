name: CI - Develop

on:
  push:
    branches: [ develop ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v4

      - name: Log version
        run: echo "Building version ${{ steps.gv.outputs.SemVer }}"

      - name: Restore backend dependencies
        run: dotnet restore Modgud.slnx
        working-directory: ./src/dotnet

      - name: Audit NuGet dependencies for known CVEs
        run: |
          set -o pipefail
          out=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -qE "has the following vulnerable packages"; then
            echo "::error ::Vulnerable NuGet packages detected. See log above."
            exit 1
          fi
        working-directory: ./src/dotnet

      - name: Build backend
        run: dotnet build Modgud.slnx -c Release --no-restore -p:Version=${{ steps.gv.outputs.SemVer }}
        working-directory: ./src/dotnet

      - name: Test backend
        run: dotnet test Modgud.slnx -c Release --no-build --verbosity normal
        working-directory: ./src/dotnet

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./src/frontend-vue

      - name: Audit npm dependencies for known CVEs
        run: pnpm audit --prod --audit-level=moderate
        working-directory: ./src/frontend-vue

      - name: Type-check frontend
        run: pnpm type-check
        working-directory: ./src/frontend-vue

      - name: Build frontend
        run: pnpm build
        working-directory: ./src/frontend-vue

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./docs

      - name: Build docs (public + in-app)
        run: pnpm build:all
        working-directory: ./docs
