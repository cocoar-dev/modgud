name: CI - PR Validation

on:
  pull_request:
    branches: [ develop ]

jobs:
  # Detect which surfaces the PR actually touches, so we don't waste CI
  # minutes building the backend for a docs-only typo fix (or vice versa).
  # Each downstream job gates its `if:` on the matching output below.
  # Changes to the CI workflows themselves trigger everything — that's
  # how we catch a broken workflow before it lands.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'src/dotnet/**'
              - '.github/workflows/ci-*.yml'
              - 'GitVersion.yml'
            frontend:
              - 'src/frontend-vue/**'
              - '.github/workflows/ci-*.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci-*.yml'

  backend:
    name: Backend Build & Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET + GitVersion
        id: dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          with-gitversion: 'true'

      - name: Restore backend dependencies
        run: dotnet restore Modgud.slnx
        working-directory: ./src/dotnet

      - name: Audit NuGet dependencies for known CVEs
        run: |
          set -o pipefail
          out=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -qE "has the following vulnerable packages"; then
            echo "::error ::Vulnerable NuGet packages detected. See log above."
            exit 1
          fi
        working-directory: ./src/dotnet

      - name: Build backend
        run: dotnet build Modgud.slnx -c Release --no-restore -p:Version=${{ steps.dotnet.outputs.version }}
        working-directory: ./src/dotnet

      - name: Test backend
        run: dotnet test Modgud.slnx -c Release --no-build --verbosity normal
        working-directory: ./src/dotnet

  frontend:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + pnpm + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: ./src/frontend-vue

      - name: Audit npm dependencies for known CVEs
        run: pnpm audit --prod --audit-level=moderate
        working-directory: ./src/frontend-vue

      - name: Type-check frontend
        run: pnpm type-check
        working-directory: ./src/frontend-vue

      - name: Build frontend
        run: pnpm build
        working-directory: ./src/frontend-vue

  docs:
    name: Docs Build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + pnpm + install
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: ./docs

      - name: Build docs (public + in-app)
        run: pnpm build:all
        working-directory: ./docs
