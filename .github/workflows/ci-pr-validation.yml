name: CI - PR Validation

on:
  pull_request:
    branches: [ develop ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v4

      - name: Restore backend dependencies
        run: dotnet restore Cocoar.Auth.slnx
        working-directory: ./src/dotnet

      - name: Build backend
        run: dotnet build Cocoar.Auth.slnx -c Release --no-restore -p:Version=${{ steps.gv.outputs.SemVer }}
        working-directory: ./src/dotnet

      - name: Test backend
        run: dotnet test Cocoar.Auth.slnx -c Release --no-build --verbosity normal
        working-directory: ./src/dotnet

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./src/frontend-vue

      - name: Build frontend
        run: pnpm build
        working-directory: ./src/frontend-vue

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./website

      - name: Build docs (public + in-app)
        run: pnpm build:all
        working-directory: ./website
