name: CD - Publish Image (GHCR)

# Builds the Modgud Docker image and pushes it to GHCR. Auto-runs on
# every push to `develop`; also available as a manual workflow_dispatch
# (e.g. to publish a feature-branch image on demand for test-server use).
#
# This is a *publish*, not a deploy: the job ends with `docker push`.
# Whatever pulls + runs it (Watchtower, a cron, a human) lives outside.
#
# Tagging (see dev-docs/future-features/versioning-publishing-conventions.md):
#   develop push     → :<version> + :beta    (e.g. :0.6.0-beta.5 + :beta)
#   feature dispatch → :<version> + :<slug>  (e.g. :0.6.0-saml-federation.8 + :saml-federation)
# `:<version>` is immutable per commit; the moving pointer (:beta / :<slug>)
# follows the branch head. `:staging` is retired. Release tags (:X.Y.Z,
# :latest) come from cd-release.yml. Exact commit is in the OCI `revision`
# label. Storage is bounded by cd-ghcr-retention.yml — there is NO auto
# GHCR retention policy configured, so cleanup is an explicit workflow.
#
# Path filtering: docs-only / markdown-only commits skip the build.

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'dev-docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'TRADEMARK.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Re-publish reason (when develop hasn''t moved)'
        required: false
        default: 'Manual republish'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build_version.outputs.VERSION }}
      semver: ${{ steps.gv.outputs.version }}
      label: ${{ steps.gv.outputs.pre-release-label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: GitVersion (no .NET needed)
        id: gv
        uses: ./.github/actions/setup-dotnet
        with:
          with-dotnet: 'false'
          with-gitversion: 'true'

      - name: Build version string
        id: build_version
        run: |
          MMP="${{ steps.gv.outputs.major-minor-patch }}"
          LABEL="${{ steps.gv.outputs.pre-release-label }}"
          N="${{ steps.gv.outputs.commits-since-version-source }}"
          # Defensive: if GitVersion produced no pre-release label (branch
          # didn't match any named config and the `other` fallback didn't
          # supply one in this GitVersion version), fall back to the
          # escaped branch name so we never emit a malformed
          # `0.5.0-.N` string that breaks the NuGet-version validator
          # downstream.
          if [ -z "$LABEL" ]; then
            LABEL="${{ steps.gv.outputs.escaped-branch-name }}"
          fi
          # If even that is empty (shouldn't happen, but…), drop the
          # pre-release segment entirely — a release-shaped version is
          # at least parseable.
          if [ -z "$LABEL" ]; then
            VERSION="$MMP.$N"
          else
            VERSION="$MMP-$LABEL.$N"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION"

  test:
    name: Build & Test
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore & build backend
        run: |
          dotnet restore Modgud.slnx
          dotnet build Modgud.slnx -c Release --no-restore -p:Version=${{ needs.version.outputs.version }}
        working-directory: ./src/dotnet

      - name: Test backend
        run: dotnet test Modgud.slnx -c Release --no-build --verbosity normal
        working-directory: ./src/dotnet

  publish:
    name: Build Image & Push to GHCR
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.version.outputs.version }}"
          LABEL="${{ needs.version.outputs.label }}"
          {
            echo "list<<EOF"
            echo "$BASE:$VERSION"
            if [ -n "$LABEL" ]; then echo "$BASE:$LABEL"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: $VERSION${LABEL:+ + $LABEL}"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish summary
        run: |
          {
            echo "### Image published to GHCR"
            echo ""
            echo "**Version (immutable):** \`${{ needs.version.outputs.version }}\`"
            echo "**Moving tag:** \`${{ needs.version.outputs.label }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Trigger:** ${{ github.event_name == 'push' && format('Auto-push from {0}', github.ref_name) || 'Manual dispatch' }}"
          } >> "$GITHUB_STEP_SUMMARY"
