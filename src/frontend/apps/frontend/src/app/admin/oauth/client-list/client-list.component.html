<div class="client-list">
  <div class="list-actions">
    <coar-button
      variant="primary"
      iconStart="plus"
      (clicked)="ui.navigateToModal('create')">
      Create Client
    </coar-button>
  </div>

  @if (error()) {
    <coar-note variant="error" padding="s" class="message">
      {{ error() }}
    </coar-note>
  }

  @if (success()) {
    <coar-note variant="success" padding="s" class="message">
      {{ success() }}
    </coar-note>
  }

  <div class="grid-container">
    <ag-grid-angular
      class="ag-theme-cocoar"
      [coarDataGrid]="clientsGrid"
      style="height: 500px; width: 100%;"
    />
    <div class="grid-actions-overlay">
      @for (client of clients(); track client.id) {
        <div class="grid-action-row">
          <coar-button
            variant="ghost"
            size="s"
            iconStart="edit"
            [routerLink]="['/admin/oauth/clients', client.id]">
            Edit
          </coar-button>
          <coar-button
            variant="ghost"
            size="s"
            iconStart="trash-2"
            [loading]="deletingId() === client.id"
            (clicked)="onDelete(client)">
            Delete
          </coar-button>
        </div>
      }
    </div>
  </div>
</div>
