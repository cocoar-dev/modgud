<div class="admin-layout">

      <div class="sidebar-header-content">
        <h1 class="sidebar-logo">Admin Panel</h1>
      </div>
    </div>

    <!-- Content -->
    <coar-menu borderless>
      <coar-menu-heading>Administration</coar-menu-heading>
      <coar-menu-item icon="users" routerLink="/admin/users" routerLinkActive="active">
        Users
      </coar-menu-item>
      <coar-menu-item icon="shield" routerLink="/admin/roles" routerLinkActive="active">
        Roles
      </coar-menu-item>
    </coar-menu>

    <div coar-sidebar-footer class="sidebar-footer" style="padding: 16px;">
      <coar-menu borderless>
        <coar-menu-item icon="arrow-left" routerLink="/">
          Back to App
        </coar-menu-item>
      </coar-menu>
    </div>
  </coar-sidebar>

  <!-- Main Content Area -->
  <main class="admin-content">
    <router-outlet />
  </main>
</div>
